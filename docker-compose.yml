services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-emmaDB}
      POSTGRES_USER: ${POSTGRES_USER:-amphitrite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-23221030}
    ports: ["5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amphitrite} -d ${POSTGRES_DB:-emmaDB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-amphitrite}:${POSTGRES_PASSWORD:-23221030}@db:5432/${POSTGRES_DB:-emmaDB}
      DATA_DIR: /data
    ports: ["8000:8000"]
    volumes:
      - ./data:/data
      - ./frontend:/app/frontend:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
